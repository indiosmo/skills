StylesPath = styles
MinAlertLevel = suggestion
Vocab = Documentation

[formats]
c = md
h = md
cc = md
cpp = md
hpp = md
cxx = md

[*.{md,c,h,cc,cpp,hpp,cxx}]
BasedOnStyles = Vale, Google

[*.{c,h,cc,cpp,hpp,cxx}]
TokenIgnores = ([@\\](?:param|tparam)[ \t]*(?:\[[^\]]+\])?[ \t]+\w+), ([@\\](?:see|sa|ref)\s+[A-Za-z_][A-Za-z_0-9:]*\([^\n)]*\)), ([@\\]snippet\s+\S+\s+\S+), ([@\\](?:ref|c|p|retval|ingroup)\s+[A-Za-z_][A-Za-z_0-9:]*), (@[A-Za-z]+), (\\[A-Za-z]+)
BlockIgnores = (?s)(@code\b.*?@endcode), (?s)(\\code\b.*?\\endcode), (?s)(@verbatim\b.*?@endverbatim), (?s)(\\verbatim\b.*?\\endverbatim)
