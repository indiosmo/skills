[project]
name = "documentation-doxygen-linter"
version = "0.1.0"
description = "Parser-backed C and C++ documentation comment checks"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.12.5",
  "tree-sitter==0.26.0",
  "tree-sitter-c==0.24.2",
  "tree-sitter-cpp==0.23.4",
]

[project.scripts]
doxygen-lint = "doxygen_linter.cli:main"

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/doxygen_linter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

